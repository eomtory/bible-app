<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 카드</title>
  <style>
    :root {
      --bg: #f6f0e5;
      --panel: #fffaf2;
      --line: #dbcdb4;
      --text: #3e2f22;
      --muted: #75614b;
      --accent: #8a4b2a;
      --accent-soft: #f0dfc4;
      --chip: #efe4d1;
      --shadow: 0 14px 28px rgba(84, 55, 24, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 28%),
        linear-gradient(180deg, #f8f2e8 0%, #efe3cf 100%);
      color: var(--text);
    }

    .app {
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 12px 28px;
    }

    .hero {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,250,242,0.98), rgba(248,236,213,0.92));
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 14px;
      margin-top: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(219, 205, 180, 0.7);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .panel-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .panel-body {
      padding: 14px 16px 16px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    select,
    button {
      font: inherit;
    }

    select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 13px;
    }

    .verse-list {
      display: grid;
      gap: 6px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .verse-tools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .verse-tool-btn {
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
    }

    .verse-summary {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .verse-option {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .verse-option.selected {
      background: #fbf1e0;
    }

    .verse-option.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .verse-option input {
      margin: 0;
      pointer-events: none;
    }

    .viewer {
      padding: 16px;
      min-height: 520px;
    }

    .viewer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .viewer-head h2 {
      margin: 0 0 4px;
      font-size: 21px;
    }

    .viewer-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .viewer-tools {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn,
    .mode-btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }

    .tool-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .mode-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .tool-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .score-text,
    .speech-status,
    .speech-result {
      font-size: 12px;
      color: var(--muted);
    }

    .speech-result {
      color: var(--accent);
      line-height: 1.5;
    }

    .chips {
      line-height: 2.15;
      font-size: 18px;
      word-break: keep-all;
    }

    .study-verse-list {
      display: grid;
      gap: 14px;
    }

    .study-verse {
      border-top: 1px dashed rgba(138, 75, 42, 0.24);
      padding-top: 12px;
    }

    .study-verse:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .study-verse-head {
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .word-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 48px;
      margin: 0 4px 6px 0;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(138, 75, 42, 0.18);
      background: var(--chip);
      vertical-align: middle;
      cursor: pointer;
      overflow: hidden;
    }

    .word-chip.revealed,
    .word-chip.hint {
      min-width: 0;
      min-height: 0;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .word-chip img {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .chip-hint {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .empty {
      padding: 44px 16px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .viewer {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <h1>성경 카드</h1>
      <p>구절을 선택하고 이미지, 빈칸, 초성, 첫글자 모드로 암기할 수 있습니다.</p>
    </section>

    <div class="layout">
      <aside class="panel">
        <div class="panel-header">
          <h2>구절 선택</h2>
          <p>책, 장, 절 순서로 선택합니다.</p>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="bookSelect">책</label>
            <select id="bookSelect"></select>
          </div>
          <div class="field">
            <label for="chapterSelect">장</label>
            <select id="chapterSelect"></select>
          </div>
          <div class="field">
            <label>절</label>
            <div class="verse-list" id="verseList"></div>
          </div>
        </div>
      </aside>

      <main class="panel">
        <div class="viewer" id="viewer"></div>
      </main>
    </div>
  </div>

  <script src="./data/default-data.js"></script>
  <script>
    const AUTO_IMAGE_DIRS = ["BibleCards_Images", "./BibleCards_Images"];
    const AUTO_IMAGE_EXTENSIONS = [".png", ".jpg", ".jpeg", ".webp", ".gif"];
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;

    const appData = normalizeData(window.BIBLE_APP_DEFAULT_DATA || {});
    const state = {
      book: "",
      chapter: "",
      verseId: "",
      selectedVerseIds: [],
      studyMode: "image"
    };

    let recognition = null;
    let isListening = false;
    let currentTranscript = "";
    let dragSelection = {
      active: false,
      value: false
    };

    function normalize(text = "") {
      return String(text).normalize("NFC").trim().replace(/\s+/g, " ");
    }

    function normalizeData(source) {
      return {
        verses: Array.isArray(source.verses) ? source.verses.slice() : [],
        cards: Array.isArray(source.cards) ? source.cards.slice() : [],
        aliases: Array.isArray(source.aliases) ? source.aliases.slice() : [],
        images: Array.isArray(source.images) ? source.images.slice() : []
      };
    }

    function buildAliasMap() {
      const map = new Map();
      appData.aliases.forEach((item) => {
        if (!item.variant || !item.base) return;
        map.set(normalize(item.variant), normalize(item.base));
      });
      return map;
    }

    function buildImageMap() {
      const map = new Map();
      appData.images.forEach((item) => {
        if (!item.key || !item.path) return;
        map.set(normalize(item.key), normalizePath(item.path));
      });
      return map;
    }

    function normalizePath(path = "") {
      return String(path)
        .replace(/^이미지\//, "BibleCards_Images/")
        .replace(/^\.\/이미지\//, "./BibleCards_Images/");
    }

    function stripPostposition(text = "") {
      const suffixes = [
        "으로부터", "에서부터", "에게서", "까지는", "까지도", "이라도", "으로는", "에게는", "에서는",
        "부터", "까지", "처럼", "보다", "하고", "이며", "이랑", "이나", "으로", "에게", "에서",
        "으로서", "으로써", "와", "과", "랑", "나", "로", "께", "에", "은", "는", "이", "가",
        "을", "를", "의", "도", "만"
      ];

      for (const suffix of suffixes) {
        if (text.length > suffix.length && text.endsWith(suffix)) {
          return text.slice(0, -suffix.length);
        }
      }
      return text;
    }

    function getBaseFormCandidates(text = "") {
      const normalized = normalize(text);
      const candidates = [];
      const push = (value) => {
        const next = normalize(value);
        if (next && !candidates.includes(next)) candidates.push(next);
      };

      if (normalized === "내" || normalized.startsWith("내게") || normalized.startsWith("내가")) {
        push("나");
      }
      if (normalized.endsWith("이라") && normalized.length > 2) {
        push(normalized.slice(0, -2));
      }
      if (normalized.endsWith("하는") && normalized.length > 3) {
        push(`${normalized.slice(0, -2)}하다`);
      }
      if (normalized.endsWith("로운") && normalized.length > 2) {
        push(normalized.slice(0, -2));
      }
      if (normalized.endsWith("한") && normalized.length > 2) {
        push(normalized.slice(0, -1));
      }
      return candidates;
    }

    function getDictionaryFormCandidates(text = "") {
      const normalized = normalize(text);
      const candidates = [];
      const push = (value) => {
        const next = normalize(value);
        if (next && !candidates.includes(next)) candidates.push(next);
      };

      const appendBatchim = (char, batchimIndex) => {
        const code = char.charCodeAt(0);
        if (code < 0xac00 || code > 0xd7a3) return "";
        const offset = code - 0xac00;
        if (offset % 28 !== 0) return "";
        return String.fromCharCode(code + batchimIndex);
      };

      const addStemVariants = (stem) => {
        const normalizedStem = normalize(stem);
        if (!normalizedStem) return;
        push(normalizedStem);
        push(`${normalizedStem}다`);
        if (normalizedStem.endsWith("으") && normalizedStem.length > 1) {
          push(`${normalizedStem.slice(0, -1)}다`);
          const base = normalizedStem.slice(0, -1);
          const head = base.slice(0, -1);
          const tail = base.slice(-1);
          const siotTail = appendBatchim(tail, 19);
          if (siotTail) push(`${head}${siotTail}다`);
        }
      };

      [
        "으리라", "리라", "느니라", "나니", "니라", "하니라", "하니", "느냐", "는가", "도다",
        "므로", "으며", "면서", "려고", "려면", "아서", "어서", "여서",
        "하며", "하여", "아도", "어도", "여도", "으면", "면", "고", "며", "게",
        "니", "라", "는", "은", "을", "던", "어", "아", "여", "나"
      ].forEach((suffix) => {
        if (normalized.length <= suffix.length || !normalized.endsWith(suffix)) return;
        addStemVariants(normalized.slice(0, -suffix.length));
      });

      return candidates;
    }

    function getResolvedImageTerms(text = "") {
      const normalized = normalize(text);
      const stripped = stripPostposition(normalized);
      const aliasMap = buildAliasMap();
      const ordered = [];
      const push = (value) => {
        const next = normalize(value);
        if (next && !ordered.includes(next)) ordered.push(next);
      };
      const score = (value) => {
        const next = normalize(value);
        if (!next) return -1;
        let point = 0;
        if (next.endsWith("하다")) point += 6;
        else if (next.endsWith("다")) point += 5;
        if (next !== normalized) point += 2;
        if (next.length > 1) point += 1;
        return point;
      };

      getDictionaryFormCandidates(normalized).sort((a, b) => score(b) - score(a)).forEach(push);
      getBaseFormCandidates(normalized).sort((a, b) => score(b) - score(a)).forEach(push);
      push(aliasMap.get(normalized));
      push(aliasMap.get(stripped));
      push(stripped);
      push(normalized);
      getLookupTerms(normalized).forEach(push);
      return ordered;
    }

    function getLookupTerms(text = "") {
      const aliasMap = buildAliasMap();
      const terms = [];
      const queue = [text];
      const seen = new Set();

      while (queue.length > 0) {
        const current = normalize(queue.shift());
        if (!current || seen.has(current)) continue;
        seen.add(current);
        terms.push(current);

        const stripped = stripPostposition(current);
        [
          stripped,
          aliasMap.get(current),
          aliasMap.get(stripped),
          ...getBaseFormCandidates(current),
          ...getDictionaryFormCandidates(current)
        ].forEach((value) => {
          const next = normalize(value);
          if (next && !seen.has(next)) queue.push(next);
        });
      }

      return terms;
    }

    function getImageCandidates(card) {
      const imageMap = buildImageMap();
      const candidates = [];
      const push = (value) => {
        const normalized = normalizePath(value);
        if (normalized && !candidates.includes(normalized)) candidates.push(normalized);
      };

      const seeds = [];
      const imageKey = normalize(card.imageKey || card.ImageKey || "");
      const text = normalize(card.wordText || card.WordText || "");
      if (text) seeds.push(...getResolvedImageTerms(text));
      if (imageKey) seeds.push(...getResolvedImageTerms(imageKey));
      const nounToVerb = (value) => {
        const stripped = stripPostposition(normalize(value));
        return stripped && !stripped.endsWith("다") ? `${stripped}하다` : "";
      };
      if (text) seeds.push(nounToVerb(text));
      if (imageKey) seeds.push(nounToVerb(imageKey));

      seeds.forEach((term) => {
        if (imageMap.has(term)) push(imageMap.get(term));
        [term.normalize("NFD"), term.normalize("NFC")].forEach((stem) => {
          const safeStem = stem.replace(/[\\/:*?"<>|]/g, "").trim();
          if (!safeStem) return;
          AUTO_IMAGE_DIRS.forEach((dir) => {
            AUTO_IMAGE_EXTENSIONS.forEach((ext) => push(`${dir}/${safeStem}${ext}`));
          });
        });
      });

      push(card.imageUrl || card.ImageURL || "");

      return candidates.map((value) => encodeURI(value));
    }

    function getBooks() {
      return [...new Set(appData.verses.map((verse) => verse.Book).filter(Boolean))];
    }

    function getChapters(book) {
      return [...new Set(
        appData.verses
          .filter((verse) => verse.Book === book)
          .map((verse) => String(verse.Chapter))
      )].sort((a, b) => Number(a) - Number(b));
    }

    function getVerses(book, chapter) {
      return appData.verses
        .filter((verse) => verse.Book === book && String(verse.Chapter) === String(chapter))
        .sort((a, b) => Number(a.Verse) - Number(b.Verse));
    }

    function getCurrentVerses() {
      return getVerses(state.book, state.chapter);
    }

    function getSelectedVerseIdsInOrder() {
      const validIds = new Set(getCurrentVerses().map((verse) => verse.VerseID));
      return state.selectedVerseIds.filter((id) => validIds.has(id));
    }

    function getSelectedVerses() {
      const selectedIds = new Set(getSelectedVerseIdsInOrder());
      return getCurrentVerses().filter((verse) => selectedIds.has(verse.VerseID));
    }

    function getCurrentVerse() {
      return appData.verses.find((item) => item.VerseID === state.verseId) || null;
    }

    function getCardsForVerse(verseId) {
      return appData.cards
        .filter((card) => card.verseId === verseId || card.VerseID === verseId)
        .map((card) => ({
          wordText: card.text || card.WordText || "",
          imageKey: card.imageKey || card.ImageKey || "",
          imageUrl: card.imageUrl || card.ImageURL || ""
        }));
    }

    function renderBooks() {
      const bookSelect = document.getElementById("bookSelect");
      const books = getBooks();
      bookSelect.innerHTML = books.map((book) => `<option value="${book}">${book}</option>`).join("");
      state.book = books[0] || "";
    }

    function renderChapters() {
      const chapterSelect = document.getElementById("chapterSelect");
      const chapters = getChapters(state.book);
      chapterSelect.innerHTML = chapters.map((chapter) => `<option value="${chapter}">${chapter}장</option>`).join("");
      state.chapter = chapters[0] || "";
    }

    function renderVerseList() {
      const verseList = document.getElementById("verseList");
      const verses = getCurrentVerses();
      if (verses.length === 0) {
        state.verseId = "";
        state.selectedVerseIds = [];
        verseList.innerHTML = `<div class="empty">등록된 절이 없습니다.</div>`;
        return;
      }

      const verseIds = verses.map((verse) => verse.VerseID);
      state.selectedVerseIds = state.selectedVerseIds.filter((id) => verseIds.includes(id));
      if (state.selectedVerseIds.length === 0) {
        state.selectedVerseIds = [verseIds[0]];
      }
      if (!state.selectedVerseIds.includes(state.verseId)) {
        state.verseId = state.selectedVerseIds[0] || "";
      }

      verseList.innerHTML = `
        <div class="verse-tools">
          <button type="button" class="verse-tool-btn" id="selectAllVersesBtn">전체 선택</button>
          <button type="button" class="verse-tool-btn" id="clearAllVersesBtn">전체 해제</button>
          <button type="button" class="verse-tool-btn" id="startSelectedVersesBtn">선택한 절 시작</button>
        </div>
        <div class="verse-summary" id="verseSummary"></div>
      `;

      document.getElementById("selectAllVersesBtn").onclick = () => {
        state.selectedVerseIds = verseIds.slice();
        if (!state.verseId) state.verseId = state.selectedVerseIds[0] || "";
        updateVerseSelectionUI();
        renderViewer();
      };

      document.getElementById("clearAllVersesBtn").onclick = () => {
        state.selectedVerseIds = [];
        state.verseId = "";
        updateVerseSelectionUI();
        renderViewer();
      };

      document.getElementById("startSelectedVersesBtn").onclick = () => {
        state.verseId = getSelectedVerseIdsInOrder()[0] || "";
        updateVerseSelectionUI();
        renderViewer();
      };

      verses.forEach((verse) => {
        const row = document.createElement("div");
        row.className = "verse-option";
        row.dataset.verseId = verse.VerseID;
        row.innerHTML = `
          <input type="checkbox" ${state.selectedVerseIds.includes(verse.VerseID) ? "checked" : ""}>
          <span>${verse.Verse}절</span>
        `;

        row.addEventListener("mousedown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          const isSelected = getSelectedVerseIdsInOrder().includes(verse.VerseID);
          dragSelection.active = true;
          dragSelection.value = !isSelected;
          applyVerseSelection(verse.VerseID, dragSelection.value);
        });

        row.addEventListener("mouseenter", () => {
          if (!dragSelection.active) return;
          applyVerseSelection(verse.VerseID, dragSelection.value);
        });

        row.addEventListener("dblclick", (event) => {
          event.preventDefault();
          if (!getSelectedVerseIdsInOrder().includes(verse.VerseID)) {
            applyVerseSelection(verse.VerseID, true);
          }
          state.verseId = verse.VerseID;
          updateVerseSelectionUI();
          renderViewer();
        });

        verseList.appendChild(row);
      });

      updateVerseSelectionUI();
    }

    function applyVerseSelection(verseId, selected) {
      const currentIds = getCurrentVerses().map((verse) => verse.VerseID);
      const selectedSet = new Set(state.selectedVerseIds.filter((id) => currentIds.includes(id)));
      if (selected) {
        selectedSet.add(verseId);
      } else {
        selectedSet.delete(verseId);
      }

      state.selectedVerseIds = currentIds.filter((id) => selectedSet.has(id));
      if (state.selectedVerseIds.includes(verseId)) {
        state.verseId = verseId;
      } else if (!state.selectedVerseIds.includes(state.verseId)) {
        state.verseId = state.selectedVerseIds[0] || "";
      }

      currentTranscript = "";
      stopListening();
      updateVerseSelectionUI();
      renderViewer();
    }

    function updateVerseSelectionUI() {
      const selectedIds = new Set(getSelectedVerseIdsInOrder());
      document.querySelectorAll(".verse-option").forEach((row) => {
        const verseId = row.dataset.verseId;
        const selected = selectedIds.has(verseId);
        row.classList.toggle("selected", selected);
        row.classList.toggle("active", verseId === state.verseId);
        const checkbox = row.querySelector("input");
        if (checkbox) checkbox.checked = selected;
      });

      const summary = document.getElementById("verseSummary");
      if (summary) {
        summary.textContent = `선택한 절 ${selectedIds.size}개`;
      }
    }

    function renderViewer() {
      const viewer = document.getElementById("viewer");
      const selectedVerses = getSelectedVerses();
      const verse = getCurrentVerse();
      if (!verse || selectedVerses.length === 0) {
        viewer.innerHTML = `<div class="empty">절을 하나 이상 선택하세요.</div>`;
        return;
      }

      const currentIndex = selectedVerses.findIndex((item) => item.VerseID === verse.VerseID) + 1;
      const heading = selectedVerses.length === 1
        ? `${verse.Book} ${verse.Chapter}장 ${verse.Verse}절`
        : `${verse.Book} ${verse.Chapter}장`;
      const description = selectedVerses.length === 1
        ? "선택한 절 1개를 암기 중입니다."
        : `선택한 절 ${selectedVerses.length}개를 함께 암기 중입니다.`;

      viewer.innerHTML = `
        <div class="viewer-head">
          <div>
            <h2>${heading}</h2>
            <p>${description}${selectedVerses.length === 1 ? "" : ` 현재 기준 절 ${currentIndex}/${selectedVerses.length}`}</p>
          </div>
        </div>
        <div class="viewer-tools">
          <div class="tool-row">
            <button class="tool-btn" id="speechStartBtn" type="button">음성 시작</button>
            <button class="tool-btn" id="speechStopBtn" type="button" disabled>음성 중지</button>
            <span class="speech-status" id="speechStatus">음성 대기</span>
          </div>
          <div class="tool-row">
            <button class="mode-btn active" data-mode="image" type="button">이미지</button>
            <button class="mode-btn" data-mode="blank" type="button">빈칸</button>
            <button class="mode-btn" data-mode="chosung" type="button">초성</button>
            <button class="mode-btn" data-mode="first" type="button">첫글자</button>
          </div>
          <div class="tool-row">
            <span class="score-text" id="scoreText">정답률: 0/0 (0%)</span>
            <button class="tool-btn" id="resetRevealBtn" type="button">다시 가리기</button>
            <button class="tool-btn primary" id="nextVerseBtn" type="button">다음 절</button>
          </div>
          <div class="speech-result" id="speechResult"></div>
        </div>
        <div class="study-verse-list" id="studyVerseList"></div>
      `;

      const list = document.getElementById("studyVerseList");
      selectedVerses.forEach((selectedVerse) => {
        const cards = getCardsForVerse(selectedVerse.VerseID);
        const block = document.createElement("section");
        block.className = "study-verse";
        block.dataset.verseId = selectedVerse.VerseID;
        block.innerHTML = `
          <div class="study-verse-head">${selectedVerse.Verse}절</div>
          <div class="chips"></div>
        `;
        const chips = block.querySelector(".chips");
        if (cards.length === 0) {
          chips.innerHTML = `<div class="empty">등록된 카드가 없습니다.</div>`;
        } else {
          renderTextWithCards(selectedVerse.FullText, cards, chips);
        }
        list.appendChild(block);
      });

      bindViewerControls();
      refreshScore();
    }

    function renderTextWithCards(fullText, cards, container) {
      let text = fullText;
      const markers = [];

      [...cards].sort((a, b) => (b.wordText || "").length - (a.wordText || "").length).forEach((card, index) => {
        if (card.wordText && text.includes(card.wordText)) {
          text = text.split(card.wordText).join(`\u0000${index}\u0000`);
          markers[index] = card;
        }
      });

      container.innerHTML = "";
      text.split(/(\u0000\d+\u0000)/).forEach((part) => {
        const match = part.match(/\u0000(\d+)\u0000/);
        if (!match) {
          container.appendChild(document.createTextNode(part));
          return;
        }

        const card = markers[Number(match[1])];
        if (!card) return;
        const chip = document.createElement("span");
        chip.className = "word-chip";
        chip.dataset.word = card.wordText;
        renderHiddenChip(chip, card);
        chip.onclick = () => toggleChip(chip, card);
        container.appendChild(chip);
      });
    }

    function toChosung(text = "") {
      const CHO = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
      return Array.from(text).map((ch) => {
        const code = ch.charCodeAt(0);
        if (code < 0xac00 || code > 0xd7a3) return ch;
        return CHO[Math.floor((code - 0xac00) / 588)];
      }).join("");
    }

    function toFirstHint(text = "") {
      if (!text) return "";
      if (text.length === 1) return text;
      return `${text[0]}${"_".repeat(Math.max(1, text.length - 1))}`;
    }

    function toBlankHint(text = "") {
      return "_".repeat(Math.max(2, text.length));
    }

    function getHiddenDisplayWord(text = "") {
      if (state.studyMode === "blank") return toBlankHint(text);
      if (state.studyMode === "chosung") return toChosung(text);
      if (state.studyMode === "first") return toFirstHint(text);
      return text;
    }

    function renderHiddenChip(chip, card) {
      chip.classList.remove("revealed", "hint");
      chip.innerHTML = "";

      if (state.studyMode !== "image") {
        chip.classList.add("hint");
        chip.innerHTML = `<span class="chip-hint">${getHiddenDisplayWord(card.wordText)}</span>`;
        return;
      }

      const candidates = getImageCandidates(card);
      if (candidates.length === 0) {
        chip.classList.add("hint");
        chip.innerHTML = `<span class="chip-hint">${card.wordText}</span>`;
        return;
      }

      const img = document.createElement("img");
      img.alt = card.wordText;
      img.loading = "lazy";
      let index = 0;
      const tryNext = () => {
        if (index >= candidates.length) {
          chip.classList.add("hint");
          chip.innerHTML = `<span class="chip-hint">${card.wordText}</span>`;
          return;
        }
        img.src = candidates[index];
        index += 1;
      };
      img.onerror = tryNext;
      chip.appendChild(img);
      tryNext();
    }

    function toggleChip(chip, card) {
      if (chip.classList.contains("revealed")) {
        renderHiddenChip(chip, card);
      } else {
        chip.classList.remove("hint");
        chip.classList.add("revealed");
        chip.textContent = card.wordText;
      }
      refreshScore();
    }

    function refreshScore() {
      const scoreText = document.getElementById("scoreText");
      if (!scoreText) return;
      const chips = [...document.querySelectorAll(".study-verse .word-chip")];
      const total = chips.length;
      const revealed = chips.filter((chip) => chip.classList.contains("revealed")).length;
      const percent = total === 0 ? 0 : Math.round((revealed / total) * 100);
      scoreText.textContent = `정답률: ${revealed}/${total} (${percent}%)`;
    }

    function resetReveal() {
      document.querySelectorAll(".study-verse").forEach((block) => {
        const verseId = block.dataset.verseId;
        const cards = getCardsForVerse(verseId);
        const chips = [...block.querySelectorAll(".word-chip")];
        chips.forEach((chip, index) => {
          if (cards[index]) renderHiddenChip(chip, cards[index]);
        });
      });
      refreshScore();
    }

    function goNextVerse() {
      stopListening();
      const verses = getSelectedVerses();
      const index = verses.findIndex((verse) => verse.VerseID === state.verseId);
      if (index < 0 || index >= verses.length - 1) return;
      state.verseId = verses[index + 1].VerseID;
      currentTranscript = "";
      updateVerseSelectionUI();
      renderViewer();
    }

    function ensureRecognition() {
      if (!SpeechRecognitionAPI) return null;
      if (recognition) return recognition;

      recognition = new SpeechRecognitionAPI();
      recognition.lang = "ko-KR";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        currentTranscript = Array.from(event.results)
          .map((result) => result[0]?.transcript || "")
          .join(" ")
          .trim();
        const resultNode = document.getElementById("speechResult");
        const statusNode = document.getElementById("speechStatus");
        if (resultNode) resultNode.textContent = currentTranscript;
        if (statusNode) statusNode.textContent = currentTranscript ? "인식 중" : "음성 대기";
      };

      recognition.onerror = () => {
        isListening = false;
        updateSpeechButtons();
      };

      recognition.onend = () => {
        isListening = false;
        updateSpeechButtons();
      };

      return recognition;
    }

    function updateSpeechButtons() {
      const startBtn = document.getElementById("speechStartBtn");
      const stopBtn = document.getElementById("speechStopBtn");
      const statusNode = document.getElementById("speechStatus");
      if (!startBtn || !stopBtn || !statusNode) return;

      startBtn.disabled = !SpeechRecognitionAPI || isListening;
      stopBtn.disabled = !SpeechRecognitionAPI || !isListening;

      if (!SpeechRecognitionAPI) {
        statusNode.textContent = "이 브라우저는 음성인식을 지원하지 않습니다.";
      } else if (!isListening && !currentTranscript) {
        statusNode.textContent = "음성 대기";
      }
    }

    function startListening() {
      const instance = ensureRecognition();
      if (!instance || isListening) return;
      currentTranscript = "";
      const resultNode = document.getElementById("speechResult");
      const statusNode = document.getElementById("speechStatus");
      if (resultNode) resultNode.textContent = "";
      if (statusNode) statusNode.textContent = "듣는 중";
      isListening = true;
      updateSpeechButtons();
      try {
        instance.start();
      } catch (error) {
        isListening = false;
        updateSpeechButtons();
      }
    }

    function stopListening() {
      if (!recognition || !isListening) {
        isListening = false;
        updateSpeechButtons();
        return;
      }
      try {
        recognition.stop();
      } catch (error) {
        isListening = false;
      }
      updateSpeechButtons();
    }

    function bindViewerControls() {
      const startBtn = document.getElementById("speechStartBtn");
      const stopBtn = document.getElementById("speechStopBtn");
      const resetBtn = document.getElementById("resetRevealBtn");
      const nextBtn = document.getElementById("nextVerseBtn");

      if (startBtn) startBtn.onclick = startListening;
      if (stopBtn) stopBtn.onclick = stopListening;
      if (resetBtn) resetBtn.onclick = resetReveal;
      if (nextBtn) nextBtn.onclick = goNextVerse;
      if (nextBtn) nextBtn.disabled = getSelectedVerses().length !== 1;

      document.querySelectorAll(".mode-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.studyMode);
        button.onclick = () => {
          state.studyMode = button.dataset.mode;
          document.querySelectorAll(".mode-btn").forEach((btn) => {
            btn.classList.toggle("active", btn === button);
          });
          resetReveal();
        };
      });

      const resultNode = document.getElementById("speechResult");
      if (resultNode) resultNode.textContent = currentTranscript;
      updateSpeechButtons();
    }

    function bindEvents() {
      document.getElementById("bookSelect").addEventListener("change", (event) => {
        stopListening();
        state.book = event.target.value;
        state.studyMode = state.studyMode || "image";
        state.verseId = "";
        state.selectedVerseIds = [];
        currentTranscript = "";
        renderChapters();
        renderVerseList();
        renderViewer();
      });

      document.getElementById("chapterSelect").addEventListener("change", (event) => {
        stopListening();
        state.chapter = event.target.value;
        state.verseId = "";
        state.selectedVerseIds = [];
        currentTranscript = "";
        renderVerseList();
        renderViewer();
      });

      document.addEventListener("mouseup", () => {
        dragSelection.active = false;
      });
    }

    function renderApp() {
      if (appData.verses.length === 0) {
        document.getElementById("bookSelect").innerHTML = "";
        document.getElementById("chapterSelect").innerHTML = "";
        document.getElementById("verseList").innerHTML = `<div class="empty">아직 등록된 구절이 없습니다.</div>`;
        document.getElementById("viewer").innerHTML = `<div class="empty">관리자 페이지에서 구절과 카드를 추가하세요.</div>`;
        return;
      }

      renderBooks();
      renderChapters();
      renderVerseList();
      renderViewer();
    }

    bindEvents();
    renderApp();
  </script>
</body>
